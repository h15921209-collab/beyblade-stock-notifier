name: Beyblade X Stock Monitor

on:
  schedule:
    # 每 15 分鐘自動執行一次巡檢 (UTC 時間)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁或 API 手動觸發
    inputs:
      trigger_source:
        description: '觸發來源 (manual: 手動點擊需回報, cron: 定時靜音巡檢)'
        required: false
        default: 'cron'

jobs:
  check-stock:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          pip install -r requirements.txt

      - name: 恢復 state.json 快取狀態
        uses: actions/cache@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: 執行商品庫存巡檢
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          IS_MANUAL_RUN: ${{ github.event.inputs.trigger_source == 'manual' }}
        run: |
          python main.py --check-once
