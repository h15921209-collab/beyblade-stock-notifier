name: Beyblade X Stock Monitor

on:
  schedule:
    # 每 15 分鐘自動執行一次巡檢 (UTC 時間)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊立即檢查

jobs:
  check-stock:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          pip install -r requirements.txt

      - name: 快取 state.json 記憶上次狀態
        uses: actions/cache@v4
        with:
          path: state.json
          key: beyblade-stock-state-${{ github.run_id }}
          restore-keys: |
            beyblade-stock-state-

      - name: 執行商品庫存巡檢
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py --check-once
